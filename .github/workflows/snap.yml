name: snapcraft

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Merge gate only: verify the snap still builds on pushes/pull requests so
  # merges can't break the build. Building AND publishing is handled by
  # snapcraft.io, so this workflow never publishes.
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build the snap
        uses: snapcore/action-build@v1.3.0
